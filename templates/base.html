<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1526">
  <title>{% block title %}PaGon{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ static_v('css/style.css') }}">
</head>
<body>
  {% block content %}{% endblock %}
  <script src="{{ static_v('js/clock.js') }}" defer></script>
  {# Podświetlanie trafień działa na gotowych wynikach, więc jeden skrypt
     obsługuje wszystkie wyszukiwarki — i te javascriptowe, i te renderowane
     po stronie serwera. Ładujemy go globalnie; na stronach bez wyszukiwarki
     nie robi nic. #}
  <script src="{{ static_v('js/podswietl.js') }}" defer></script>
</body>
</html>
